name: Scrobble aka CI

# A ready PR runs the checks and rebase-merges once they pass. Every push to main runs CI again and deploys
# og.trakt.tv, like trakt-web. "Run workflow" from main redeploys it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.pull_request.draft != true
    name: Totally Ninja aka CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/client
    # One deploy at a time; a newer push to main waits rather than racing an older one.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'deploy-main' || github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the leak check reads origin/main
      - uses: ./.github/actions/setup-bun
      - run: bash scripts/leak-check.sh $PR_NUMBER
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      # Only the deploy needs the real client ID. Fork PRs get no secrets and build with an empty one.
      - name: Checking the Ticket aka Require the Client ID
        if: github.ref == 'refs/heads/main'
        run: '[ -n "$TRAKT_CLIENT_ID" ] || { echo "::error::Add the TRAKT_CLIENT_ID repo secret."; exit 1; }'
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      - run: bun run ci
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      - name: Now Playing aka Deploy to og.trakt.tv
        if: github.ref == 'refs/heads/main'
        run: bun x wrangler deploy --message "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  commits:
    name: Check-in History aka Commits
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/client
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads the PR's commit range
      - uses: ./.github/actions/setup-bun
      - name: Checking In aka Commitlint
        run: bun x commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: No Weak Sauce aka Forbid Fixup Commits
        run: |
          if git log --format=%s ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '^(fixup|squash|amend)! '; then
            echo "::error::Fold fixup commits in before marking the PR ready."
            exit 1
          fi

  merge:
    # Forks can't read the App secrets; a maintainer merges those by hand. The App token matters: a merge made with
    # GITHUB_TOKEN doesn't trigger the push to main, so nothing would deploy. Waiting on CI and Commits keeps a broken PR
    # from merging even before branch protection requires them; branch protection adds Supply Chain.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository
    needs: [ci, commits]
    name: Binge Mode aka Enable Auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Borrowing the Login aka GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Queue It Up aka Auto-merge
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --rebase --auto
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
