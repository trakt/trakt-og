# From trakt-web. Exact pins, trustedDependencies drift, frozen install, provenance, dependency review.
name: VIP Bouncer aka Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  hardened-audit:
    name: Velvet Rope aka Hardened Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/client
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Lock the Side Door aka Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            jsr.io:443
            npm.jsr.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Grab the Remote aka Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up the Couch aka Setup Bun
        uses: ./.github/actions/setup-bun

      - name: No Fast-Forwarding aka Forbid Semver Ranges
        run: |
          set -euo pipefail
          OFFENDERS=$(
            jq -r '
              (.dependencies // {}) + (.devDependencies // {})
              | to_entries[]
              | select(.value | test("^[\\^~]"))
              | "\(.key)@\(.value)"
            ' package.json ../../package.json
          )
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Non-exact version ranges detected. Pin exact versions."
            echo "$OFFENDERS"
            exit 1
          fi

      - name: No Plus-Ones aka Block Silent Postinstall Grants
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          # Any entry that isn't on the base's list needs review, not just a longer list. A non-array value counts as a
          # change too, and a base without a root package.json counts as an empty list.
          SCRIPTS='[(.trustedDependencies // []) | if type == "array" then .[] | tostring else "non-array: " + tojson end]'
          BEFORE=$( (git show "origin/${{ github.event.pull_request.base.ref }}":package.json 2>/dev/null || echo '{}') | jq -c "$SCRIPTS")
          AFTER=$(jq -c "$SCRIPTS" ../../package.json)
          ADDED=$(jq -rn --argjson a "$AFTER" --argjson b "$BEFORE" '$a - $b | join(", ")')
          if [ -n "$ADDED" ]; then
            if gh pr view "$PR_NUMBER" --repo trakt/trakt-og --json labels -q '.labels[].name' | grep -qx 'allowlist-change'; then
              echo "trustedDependencies gained $ADDED - label present, allowed."
            else
              echo "::error::trustedDependencies gained $ADDED without the 'allowlist-change' label."
              echo "Add the 'allowlist-change' label after manual review of every new entry."
              exit 1
            fi
          fi

      - name: Rewatch From the Lockfile aka Frozen Install
        run: bun run install:frozen

      - name: Check the Credits aka Audit Signatures
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -d node_modules ]; then
            npm audit signatures || {
              echo "::warning::npm audit signatures reported issues. Review before merging."
              exit 0
            }
          else
            echo "::warning::node_modules not present after bun install - skipping signature audit."
          fi

  dependency-review:
    # Dependency review runs when this workflow handles a pull request.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    name: Guest List aka Dependency Review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/client
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Lock the Side Door aka Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            codeload.github.com:443
            github.com:443
            jsr.io:443
            npm.jsr.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            www-api.ibm.com:443

      - name: Grab the Remote aka Checkout Code
        uses: actions/checkout@v7

      - name: Screen the New Releases aka Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
