<!doctype html>
<html lang="en" data-theme="%og.theme%">
  <head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta property="og:site_name" content="Trakt OG Redux" />
		<meta property="og:locale" content="en_US" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@trakt" />
		<meta name="application-name" content="Trakt OG Redux" />
		<meta name="apple-mobile-web-app-title" content="Trakt OG Redux" />
		<meta name="theme-color" content="#111111" />
		<!-- media.trakt.tv's hotlink protection 403s .jpg avatars and covers for unknown referers (localhost, previews). -->
		<meta name="referrer" content="same-origin" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
  <body data-sveltekit-preload-data="%og.preload%" data-sveltekit-preload-code="viewport">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
