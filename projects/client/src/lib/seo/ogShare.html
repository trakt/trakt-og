<!doctype html>
<!--
  The default share image, static/og-share.jpg: the Trakt OG Redux lockup from the home hero, with the classic red mark
  as the O. To export it again, open this file in a browser at 1200x630 and save a JPG screenshot over
  static/og-share.jpg.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Figtree;
        font-weight: 300 900;
        font-display: block;
        src: url('../assets/fonts/figtree-latin.woff2') format('woff2');
      }
    </style>
    <style>
      :root {
        --red: #ed1c24;
        --white: #fff;
        --soft: rgb(255 255 255 / 0.82);
        --muted: #999;
        --bg: #111;
      }

      html,
      body {
        margin: 0;
      }

      .card {
        box-sizing: border-box;
        display: grid;
        align-content: center;
        gap: 34px;
        inline-size: 1200px;
        block-size: 630px;
        padding-inline: 96px;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 88% 18%, rgb(237 28 36 / 0.22), transparent 46%),
          radial-gradient(circle at 8% 100%, rgb(237 28 36 / 0.1), transparent 40%),
          var(--bg);
        color: var(--white);
        font-family: Figtree, sans-serif;
        font-weight: 800;
      }

      .trakt {
        font-size: 26px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      .name {
        display: flex;
        align-items: center;
        margin-block: -12px -6px;
        font-size: 184px;
        line-height: 0.8;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }

      .mark {
        inline-size: 0.78em;
        block-size: 0.78em;
        margin-inline-end: 0.02em;
        fill: var(--red);
      }

      .g {
        color: var(--red);
      }

      .redux {
        margin-inline-start: 0.18em;
      }

      .tagline {
        margin: 0;
        font-size: 38px;
        letter-spacing: -0.01em;
        color: var(--soft);
      }

      .domain {
        position: absolute;
        inset-block-end: 44px;
        inset-inline-end: 56px;
        font-size: 22px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="trakt">Trakt</span>
      <span class="name">
        <svg class="mark" viewBox="0 0 98.1 98.1" aria-hidden="true">
          <path d="M20,75.8c7.2,7.8,17.6,12.8,29.1,12.8c5.9,0,11.5-1.3,16.5-3.6L38.2,57.6L20,75.8z" />
          <path
            d="M38,41.1L17.3,61.8L14.5,59l21.8-21.8h0l25.5-25.5c-4-1.4-8.3-2.1-12.8-2.1C27.3,9.6,9.6,27.2,9.6,49.1c0,8.9,2.9,17.1,7.9,23.7l20.7-20.7l1.4,1.4L69.2,83c0.6-0.3,1.2-0.7,1.7-1.1L38.2,49.2L18.3,69.1l-2.8-2.8l22.7-22.7l1.4,1.4l34.5,34.5c0.5-0.4,1-0.9,1.5-1.3L38.4,41.1L38,41.1z"
          />
          <path
            d="M78.4,75.5c6.3-7,10.2-16.3,10.2-26.5c0-15.8-9.3-29.5-22.8-35.8L41,38.1L78.4,75.5z M50.5,45.3l-2.8-2.8L67.3,23l2.8,2.8L50.5,45.3z M69.1,18.4L46.5,41l-2.8-2.8l22.6-22.6L69.1,18.4z"
          />
          <path
            d="M49.1,98.1C22,98.1,0,76.1,0,49.1C0,22,22,0,49.1,0s49.1,22,49.1,49.1C98.1,76.1,76.1,98.1,49.1,98.1z M49.1,4.9C24.7,4.9,4.9,24.7,4.9,49.1s19.8,44.1,44.1,44.1s44.1-19.8,44.1-44.1S73.4,4.9,49.1,4.9z"
          />
        </svg>
        <span class="g">G</span>
        <span class="redux">Redux</span>
      </span>
      <p class="tagline">Classic Trakt, rebuilt for big screens.</p>
      <span class="domain">og.trakt.tv</span>
    </div>
  </body>
</html>
